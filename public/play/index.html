/* Layout: a handheld-console column. Pixel canvas on top, a status strip above it, and the dialogue/battle panel below with touch controls. */
:root{
  --bg:#E9EBE4; --paper:#F6F7F2; --ink:#1C2320; --muted:#58625C; --rule:#C6CABF; --wash:#DDE1D7;
  --gules:#9C2A2C; --or:#9A7120; --azure:#2B4970; --vert:#3A6848; --flame:#B8531A; --argent:#5F6E79;
  --display:"Grenze Gotisch",Georgia,serif; --body:"Alegreya",Georgia,serif;
  --sans:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --paper:#181D1A; --ink:#E4E7DF; --muted:#9BA49D; --rule:#323A35; --wash:#212823;
  --gules:#D8585C; --or:#D8AA4E; --azure:#86A7D8; --vert:#7FB28E; --flame:#EA8A4E; --argent:#A8B4BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --paper:#181D1A; --ink:#E4E7DF; --muted:#9BA49D; --rule:#323A35; --wash:#212823;
  --gules:#D8585C; --or:#D8AA4E; --azure:#86A7D8; --vert:#7FB28E; --flame:#EA8A4E; --argent:#A8B4BD; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
.wrap{max-width:52rem;margin:0 auto;padding-inline:1rem;padding-block:1.25rem 3rem}
.kicker{font-family:var(--sc);letter-spacing:.16em;font-size:.76rem;color:var(--gules);margin:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1;margin:.1rem 0 .8rem}
button{font:inherit;font-family:var(--sc);letter-spacing:.05em;font-size:.9rem;border-radius:6px;padding:.5rem .9rem;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button:disabled{opacity:.45;cursor:default}
button small{display:block;font-family:var(--sans);letter-spacing:0;font-size:.74rem;opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--or);outline-offset:2px}
select,input[type=text]{width:100%;font:inherit;font-family:var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:.45rem .6rem}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:.9rem 1rem;min-width:0}
.field{display:grid;gap:.2rem;margin-bottom:.65rem;font-family:var(--sans);font-size:.9rem;font-weight:700}
.hint{font-family:var(--sans);font-size:.86rem;color:var(--muted);font-weight:400;margin:.2rem 0 0}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.setup h2{font-family:var(--display);font-size:1.5rem;margin:0 0 .5rem}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;font-family:var(--sans);font-size:.92rem;margin-bottom:.45rem}
.hud .obj{flex:1;min-width:12rem}
.hud .obj b{font-family:var(--sc);letter-spacing:.08em;font-size:.75rem;color:var(--gules);margin-right:.35rem}
.hud .lives svg{width:.95rem;height:1.1rem;color:var(--azure);vertical-align:-2px}
.hud .lives .spent path{fill:transparent}
.screen{position:relative;border-radius:8px;overflow:hidden;border:3px solid var(--ink);background:#10140f;max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/176;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.panel{margin-top:.6rem;min-height:7.5rem}
.panel .who{font-family:var(--sc);letter-spacing:.1em;font-size:.76rem;color:var(--gules);margin:0 0 .15rem;font-weight:700}
.panel .say{margin:0 0 .6rem;font-size:1.02rem}
.panel .prompt{font-family:var(--sans);font-weight:700;margin:0 0 .45rem}
.btns{display:flex;flex-wrap:wrap;gap:.4rem}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.6rem}
.fighter{font-family:var(--sans);font-size:.85rem;border-left:4px solid var(--oc,var(--azure));padding-left:.5rem;min-width:0}
.fighter b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:.45rem;background:var(--wash);border-radius:999px;overflow:hidden;margin:.2rem 0}
.wbar i{display:block;height:100%;background:var(--oc,var(--azure))}
.chip{display:inline-block;font-family:var(--sc);font-size:.7rem;letter-spacing:.05em;border-radius:999px;padding:0 .45rem;border:1px solid var(--gules);color:var(--gules);margin:.1rem .1rem 0 0}
.chip.good{border-color:var(--vert);color:var(--vert)}
.log{margin-top:.6rem;max-height:14rem;overflow-y:auto;font-family:var(--sans);font-size:.88rem}
.log p{margin:.2rem 0;padding:.2rem 0;border-bottom:1px dashed var(--rule)}
.log p.phase{font-family:var(--sc);letter-spacing:.1em;font-size:.74rem;color:var(--gules);border:none;margin-top:.5rem}
.log p.big{font-family:var(--display);font-size:1.2rem;border:none}
.d{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border:1px solid var(--rule);border-radius:4px;font-size:.76rem;font-weight:700;margin:0 1px;background:var(--bg)}
.d.ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.d.six{background:var(--gules);color:#fff;border-color:var(--gules)}
.pad{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.6rem;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(3,3rem);gap:.2rem}
.dpad button{padding:0;font-size:1.2rem;border-radius:8px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .dn{grid-column:2;grid-row:3}
.abtn{width:4.2rem;height:4.2rem;border-radius:50%;font-size:1.1rem;background:var(--gules);border-color:var(--gules);color:#fff}
.keys{font-family:var(--sans);font-size:.82rem;color:var(--muted);text-align:center;flex:1}
@media (hover:hover) and (pointer:fine){.pad .dpad,.pad .abtn{display:none}.pad{justify-content:center}}
.end{text-align:center}
.hud .lvl{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.hud .lvl b{font-family:var(--sc);letter-spacing:.06em;font-size:.82rem}
.xpbar{display:inline-block;width:4.5rem;height:.45rem;background:var(--wash);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--or)}
.lvlup{color:var(--or)}
.sheet h2{font-family:var(--display);font-size:1.6rem;margin:0 0 .2rem}
.statrow{display:flex;flex-wrap:wrap;gap:.3rem;font-family:var(--sans);font-size:.88rem}
.statrow span{border:1px solid var(--rule);border-radius:6px;padding:.1rem .45rem;background:var(--bg)}
.perks{list-style:none;padding:0;margin:.4rem 0 .7rem;font-family:var(--sans);font-size:.88rem}
.perks li{padding:.25rem 0 .25rem .6rem;border-left:3px solid var(--rule);margin:.2rem 0;color:var(--muted)}
.perks li.got{border-color:var(--or);color:var(--ink)}
#mini{display:block;width:100%;height:auto;aspect-ratio:96/58;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;margin-top:.3rem}
.end h2{font-family:var(--display);font-size:2rem;margin:.2rem 0}
</style>

const poss = (m) => m.side === "you" ? "Your" : esc(short(m)) + "'s";
function woundNeed(S, T){ if (S >= 2*T) return 2; if (S > T) return 3; if (S === T) return 4; if (S*2 <= T) return 6; return 5; }

const bt = (x,y) => (x<0||y<0||x>=GW||y>=GH) ? "T" : tileAt(B.ox+x, B.oy+y);
const open = (x,y) => !SOLID.has(bt(x,y));
const moveTiles = (m) => m.leg ? 1 : Math.floor(m.M/2);
const other = (m) => m === B.you ? B.foe : B.you;
const engagedNow = () => !B.you.dead && !B.foe.dead && cheb(B.you, B.foe) === 1;
function gridLos(a, b){
  let x0=a.x, y0=a.y; const x1=b.x, y1=b.y; const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx+dy, cover=false;
  while (true) { const e2=2*err; if (e2>=dy){err+=dy;x0+=sx;} if (e2<=dx){err+=dx;y0+=sy;} if (x0===x1&&y0===y1) break;
    const t = bt(x0,y0); if (LOS_BLOCK.has(t)) return {clear:false}; if (COVER.has(t)) cover=true; }
  if (bt(b.x,b.y)==="%" || bt(b.x,b.y)==="r" || bt(b.x,b.y)==="x") cover = true;
  return {clear:true, cover};
}
// Reachable tiles for a mover (8-way, difficult ground costs 2). Tiles touching the enemy are charges.
function reach(m, {fallBack=false} = {}){
  const foe = other(m), max = moveTiles(m), out = new Map();
  const q = [{x:m.x,y:m.y,c:0}]; const best = new Map([[m.x+","+m.y,0]]);
  while (q.length) {
    q.sort((a,b)=>a.c-b.c); const cur = q.shift();
    for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) {
      if (!dx && !dy) continue; const nx=cur.x+dx, ny=cur.y+dy;
      if (!open(nx,ny) || (nx===foe.x && ny===foe.y)) continue;
      const tt = bt(nx,ny); const c = cur.c + (DIFFICULT.has(tt) && !(tt === "x" && m.fac === "bt") ? 2 : 1); if (c > max) continue;
      const k = nx+","+ny; if (best.has(k) && best.get(k) <= c) continue; best.set(k,c);
      const touching = !foe.dead && cheb({x:nx,y:ny}, foe) === 1;
      if (touching) { if (!fallBack && !m.leg && !foe.cond.frozen) out.set(k, {x:nx,y:ny,c,charge:true}); continue; } // stop on contact
      out.set(k, {x:nx,y:ny,c,charge:false});
      if (!(cheb(cur, foe) === 1 && fallBack && false)) q.push({x:nx,y:ny,c});
    }
  }
  return [...out.values()];
}

function effWeapon(m, name){
  const base = W[name]; const w = {...base, name};
  if (m.arm && (w.twoH || w.shield)) return { name:"Single Short (one arm)", A:1, hit:3, S:3, AP:0, D:1 };
  if (m.arm) w.A = Math.max(1, w.A - 1);
  if (m.knight && m.order==="sword" && name==="Dual Short") w.A += 1;
  if (m.bonusA) w.A += m.bonusA;
  if (name === "Bow" && m.side === "you") { if (m.bowS) w.S = m.bowS; if (m.bowA) w.A += m.bowA; }
  if (!w.range && m.bonusS) w.S += m.bonusS;
  if (!w.range && m.berserk && m.W <= m.maxW/2) w.A += 1;
  if (m.cond.heat && !w.range) w.A = 1;
  if (m.hero && !(m.sig && w.range)) { w.A += 1; w.hit = Math.max(2, w.hit - 1); }
  return w;
}
function saveTarget(def, wpn){
  let sv = def.baseSv;
  if (sv != null && def.damaged) sv += 1;
  if (sv != null && sv > 6) sv = null;
  const dw = W[def.weapon]; const hasShield = dw && dw.shield && !def.arm;
  if (hasShield && !(wpn.breaker || wpn.wrap)) sv = (sv == null) ? 6 : sv - 1;
  if (sv == null) return null;
  sv = Math.max(2, sv - (wpn.AP || 0));
  return sv > 6 ? null : sv;
}

async function attack(att, def, wpn, opts = {}){

  if (reach) mods -= 1;
  const shadowed = att.side === "you" && B.shadow && cheb(att, B.shadow) <= 1;
  if (shadowed) mods -= 1;

    let rolls = []; for (let i = 0; i < wpn.A; i++) rolls.push(d6());

    const misses = rolls.length - hits;
    if (reach && !hits) log(`<b>"${esc(def.sig.quote)}"</b> ${esc(short(def))} dances just out of reach.`);
    log(`${nm(att)} ${v(att,"strike","strikes")} with ${esc(wpn.name)}${opts.aimed ? ` (aimed at the ${opts.aimed})` : ""}${opts.cover ? " into cover" : ""}${reach ? " at the edge of his reach" : ""}${shadowed ? " out of the shadows" : ""}: ${dice(rolls, target)} needs ${target}+, <b>${hits} hit${hits===1?"":"s"}</b>.`);
    if (opts.melee && def.knight && def.order === "sword" && misses > 0) {
      log(`<b>Master of the Blade:</b> ${esc(short(def))} punishes ${misses} miss${misses===1?"":"es"}.`);
      for (let i = 0; i < misses && !att.dead; i++) await damage(att, { lethal:false, D:1, mortal:true, by:def });
    }

  if (!hits || att.dead) return;

    if (sv != null) {
      let s = d6(), ok = s !== 1 && s >= sv;
      if (ok && att.knight && att.order === "serpent" && !B.guileUsed) { B.guileUsed = true; log(`<b>Serpent's Guile:</b> ${esc(short(att))} forces a re-roll of your ${dice([s], sv)} save.`); s = d6(); ok = s !== 1 && s >= sv; }
      log(`${nm(def)} ${v(def,"save","saves")} on ${sv}+: ${dice([s], sv)} ${ok ? "<b>saved</b>." : "failed."}`);
      if (!ok && def.battlemaster && !B.bmUsed) { B.bmUsed = true; s = d6(); ok = s !== 1 && s >= sv; log(`<b>Battlemaster:</b> you re-roll the save: ${dice([s], sv)} ${ok ? "<b>saved</b>." : "failed."}`); }

    await attack(att, def, { ...wpn, name: wpn.name + ", swung harder", A: 1, S: wpn.S + 1, AP: (wpn.AP || 0) - 1 }, { ...opts, doubt: true });
  }
}
async function damage(m, { lethal, D = 1, aimed, mortal, by, melee }){

  if (m.cond.stoneskin) { m.cond.stoneskin = false; log(`<b>Stoneskin</b> absorbs the wound.`); return; }

    const limb = aimed || (d6() <= 3 ? "arm" : "leg"); const already = m[limb]; m[limb] = true;

function knightReturns(){

/* ============================== battle flow ============================== */
async function startBattle(spec){

  let foe, fpos;
  if (spec.kind === "troop") { foe = makeTroop(spec.ref.type); if (spec.ref.lives) foe.lives = spec.ref.lives; fpos = {x:spec.ref.x, y:spec.ref.y}; }

  else { foe = makeKnight(state.bossOrder, state.bossName, state.bossLives); fpos = {x:state.boss.x, y:state.boss.y}; }
  const mx = Math.round((state.x + fpos.x)/2), my = Math.round((state.y + fpos.y)/2);
  B = { spec, ox: Math.max(0, Math.min(MW-GW, mx - 6)), oy: Math.max(0, Math.min(MH-GH, my - 4)), round:0, you:y, foe, hl:[], log:[] };
  y.x = state.x - B.ox; y.y = state.y - B.oy; y.dead = false; y.cond = {}; y.book = y.bookBase ? {...y.bookBase} : null; y.heroic = y.heroicBase;
  if (y.rage) y.cond.stoneskin = true;

  $("#panel").innerHTML = `<div class="card"><p class="hint" id="rnd" style="margin:0 0 .4rem"></p><div class="fighters" id="fighters"></div><div id="act"></div></div><div class="card log" id="log" aria-live="polite"></div>`;
  log(spec.kind === "boss" || spec.kind === "duel" ? `${esc(foe.name)} draws steel. The duel begins.` : foe.elite ? `${esc(foe.name)} steps up to fight you!` : `A ${esc(foe.name)} spots you and charges in!`, "big");
  if (y.rage) log("<b>Unstoppable:</b> you start the fight with Stoneskin.");
  if (foe.sig) log(`<b>Signature, ${esc(foe.sig.name)}:</b> ${esc(foe.sig.text)}`);
  renderBattle();
  while (!B.result) await battleRound();

}
async function battleRound(){
  const y = B.you, f = B.foe;
  B.round++; B.shadow = null; B.supportUsed = false; B.doubtUsed = false; B.confuseUsed = false; B.guileUsed = false; B.bmUsed = false; B.pinUsed = false; B.pinSpent = false; B.arrowUsed = false; B.healUsed = false; B.charged = null; B.uphill = null; y.cond.fellBack = false; f.cond.fellBack = false;

  log(`Priority: you ${dice([a])} vs ${esc(short(f))} ${dice([b])}. <b>${pri==="you"?"You":esc(short(f))}</b> ${pri==="you"?"go":"goes"} first.`);

    const h = await choose(`${esc(short(f))} moves first. Spend a Heroic Action to move first?`, [["yes","Heroic Action",`Act first this phase (${y.heroic} left)`],["no","Let them move",""]]);

  }

  await shootYou(); renderBattle(); if (B.result) return;
  await shootFoe(); renderBattle(); if (B.result) return;
  if (engagedNow()) {
    let fFirst = B.charged && B.uphill !== B.charged ? B.charged : pri;
    if (fFirst === "you" && f.heroic && f.knight && !B.charged && Math.random() < .6) { f.heroic--; fFirst = "foe"; log(`<b>Heroic Action!</b> ${esc(short(f))} strikes first.`); }

      const h = await choose(`${esc(short(f))} strikes first. Spend a Heroic Action to strike first?`, [["yes","Heroic Action",`Strike first (${y.heroic} left)`],["no","Take the blow",""]]);
      if (h === "yes") { y.heroic--; fFirst = "you"; log("<b>Heroic Action!</b> You strike first."); }

}
async function order(first, ya, fa){ if (first === "you") { await ya(); if (!B.result) await fa(); } else { await fa(); if (!B.result) await ya(); } }

async function moveYou(){

  } else {
    opts.push(["hold","Stand and fight","Stay engaged"]);

    y.cond.fellBack = true;

}
// Scoot's signature: a point-blank arrow at a charging foe.
async function supportArrow(y, f){

  const los = gridLos(f, y); if (!los.clear || cheb(f, y)*2 > 24) return;
  B.supportUsed = true; B.pinSpent = true;
  log(`<b>Close Arrow Support:</b> "${esc(f.sig.quote)}" ${esc(short(f))} looses an arrow as you charge.`);
  await attack(f, y, effWeapon(f, "Bow"), { cover: los.cover, chargeHit: true, support: true });
  renderBattle();

// Sir Rose Thorn's signature: a reaction shot that stops a charge.

    if (engaged && B.charged === "you") { log(`${esc(short(f))} is caught by the charge and must fight.`); return; }

async function shootYou(){

    if (!B.arrowUsed) { opts.push(["pin","Pinning Arrow","On a hit, the foe can't move next activation"]); opts.push(["phase","Phase Arrow","Ignores armor saves"]); }

}
async function shootFoe(){

  if (f.caster && !f.dead && !f.cond.frozen && !B.result && !engagedNow() && !f.cond.fellBack && !y.cond.frozen) {

}
async function fightYou(){

      <p class="hint" id="ptext"></p>
    </div>
    <div class="card"><h2>The season</h2>
      <label class="field">Difficulty<select id="pdiff"><option value="standard"${last.diff!=="story"?" selected":""}>Standard: the tabletop rules</option><option value="story"${last.diff==="story"?" selected":""}>Story: 7 lives, 6 W, 2 potions, 2 Heroic Actions</option></select></label>
      <label class="field">The Knight who comes to test you<select id="kname"><option value="random">Surprise me (a fair Crown or Flame Knight)</option>${["sword","battle","crown","flame","serpent"].map(o => `<optgroup label="${ORDERS[o].name}">${KNIGHTS.filter(k=>k[0]===o).map(k=>`<option value="${esc(k[1])}"${last.knight===k[1]?" selected":""}>${esc(k[1])}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <p class="hint">Level 1: T4 · W5 · Ld8 · Heroic (+1 Attack, +1 to hit). Win fights to earn experience and climb to level 6, Paragon, unlocking class abilities at levels 3, 5 and 6. Damage carries between fights until a Healer patches you up. Fall in battle and you walk back to the last Nirvana shrine you touched.</p>
    </div>
  </div>
  <p style="margin-top:1rem"><button type="button" id="go">Begin the season</button></p>`;
  const sync = () => {
    const c = CLASSES[$("#pcls").value]; const kw = $("#pwpn").value, ka = $("#parm").value;
    $("#pwpn").innerHTML = c.weapons.map(w => `<option${(kw||last.weapon)===w?" selected":""}>${w}</option>`).join("");
    $("#parm").innerHTML = c.armor.map(a => `<option${(ka||last.armor)===a?" selected":""}>${a}</option>`).join("");
    $("#ptext").textContent = c.text;
  };
  $("#pcls").addEventListener("change", () => { $("#pwpn").value=""; $("#parm").value=""; sync(); });
  sync();
  $("#go").addEventListener("click", () => {
    const cfg = { name: $("#pname").value.trim() || "Newcomer", cls: $("#pcls").value, weapon: $("#pwpn").value, armor: $("#parm").value, diff: $("#pdiff").value, knight: $("#kname").value };
    state = newState(cfg); save(); play();
    say([{who:"", text:`Dawn at your home park. Someone is shouting by the hall. Warmaster Holt is waving you over.`}]);
  });
  $("#cont")?.addEventListener("click", () => { state = saved; play(); });
}
function play(){
  buildMap();
  $("#app").innerHTML = `
    <div class="hud" id="hud"></div>
    <div class="screen"><canvas id="cv" width="256" height="176" tabindex="0" aria-label="Game map. Arrow keys move; Space interacts."></canvas></div>
    <div class="pad" aria-hidden="false">
      <div class="dpad"><button type="button" class="u" data-d="up" aria-label="Up">▲</button><button type="button" class="l" data-d="left" aria-label="Left">◀</button><button type="button" class="r" data-d="right" aria-label="Right">▶</button><button type="button" class="dn" data-d="down" aria-label="Down">▼</button></div>
      <span class="keys">Arrows or WASD to move · Space or Enter to act · tap tiles in battle</span>
      <button type="button" class="abtn" id="abtn" aria-label="Act">A</button>
    </div>
    <div class="panel" id="panel"></div>
    <p class="hint btns" style="margin-top:.8rem"><button type="button" class="ghost" id="sheetbtn">Character and map</button><button type="button" class="ghost" id="menu">Save and leave</button></p>`;
  cv = $("#cv"); cx = cv.getContext("2d"); cx.imageSmoothingEnabled = false;
  mode = "world"; idlePanel(); hud();
  cv.addEventListener("pointerdown", ev => {
    if (mode === "battle" && B && B.hl.length) { const t = canvasTile(ev); if (B.hl.some(h => h.x===t.x && h.y===t.y)) resolve(`tile:${t.x},${t.y}`); }
    else cv.focus({preventScroll:true});
  });
  document.querySelectorAll(".dpad button").forEach(b => {
    const d = b.dataset.d;
    b.addEventListener("pointerdown", e => { e.preventDefault(); held.add(d); });
    ["pointerup","pointerleave","pointercancel"].forEach(t => b.addEventListener(t, () => held.delete(d)));
  });
  $("#abtn").addEventListener("click", () => interact());
  $("#menu").addEventListener("click", () => { save(); setup(); });
  $("#sheetbtn").addEventListener("click", () => mode === "sheet" ? closeSheet() : openSheet());
  requestAnimationFrame(loop);
}
function gameOver(){
  $("#panel").innerHTML = `<div class="card end"><h2>The day is done</h2><p>You've spent every life for today. Your progress is kept: dead Hounds stay beaten and the banner stays where you left it.</p><div class="btns" style="justify-content:center"><button type="button" id="again">Start a new day</button><button type="button" class="ghost" id="tomenu">Main menu</button></div></div>`;
  $("#again").addEventListener("click", () => { const y = state.you; y.lives = y.maxLives; y.W = y.maxW; y.arm = y.leg = false; state.x = state.shrine.x; state.y = state.shrine.y; respawnAll(); mode = "world"; save(); hud(); idlePanel(); });
  $("#tomenu").addEventListener("click", setup);
}
function showEnd(){
  mode = "end"; save();
  const mins = Math.max(1, Math.round((Date.now() - state.started) / 60000));
  $("#panel").innerHTML = `<div class="card end"><p class="kicker">Chapter one complete</p><h2>The Banner Holds</h2>
    <p>${esc(state.you.name)}, Paragon ${esc(state.you.cls)}: ${state.wins} battle${state.wins===1?"":"s"} won, ${state.you.lives} of ${state.you.maxLives} lives left, about ${mins} minute${mins===1?"":"s"} on the field.</p>
    <p>Holt has unbarred the east gate. Beyond it lie the Marches: brigands, a rival park, a ruined keep, and a tourney field where Knights of the realm take challenges. Every win earns experience toward level 6, Paragon.</p>
    <div class="btns" style="justify-content:center"><button type="button" id="ride">Ride into the Marches</button><button type="button" class="ghost" id="newgame">Start a new season</button></div></div>`;
  $("#ride").addEventListener("click", () => { mode = "world"; save(); hud(); idlePanel(); cv.focus({preventScroll:true}); });
  $("#newgame").addEventListener("click", () => { store.clear(); setup(); });
}

/* ============================== input ============================== */
const KEYMAP = {ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};
document.addEventListener("keydown", e => {
  if (!state || ["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  if (KEYMAP[e.code] && (mode === "world")) { held.add(KEYMAP[e.code]); e.preventDefault(); }
  if ((e.code === "Space" || e.code === "Enter" || e.code === "KeyE") && (mode === "world" || mode === "dialog" || mode === "sheet")) {
    if (e.target.tagName === "BUTTON" && mode === "sheet") return;
    if (e.target.tagName === "BUTTON" && mode === "dialog") return; // the focused Continue button handles it
    e.preventDefault(); interact();
  }
});
document.addEventListener("keydown", e => {
  if (!state || ["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.code === "KeyC" || e.code === "KeyM") { if (mode === "world") openSheet(); else if (mode === "sheet") closeSheet(); }
  if (e.code === "Escape" && mode === "sheet") closeSheet();
});
document.addEventListener("keyup", e => { if (KEYMAP[e.code]) held.delete(KEYMAP[e.code]); });
window.addEventListener("blur", () => held.clear());

if (window.__COB_TEST) window.__cob = { get state(){ return state; }, get mode(){ return mode; }, get B(){ return B; },
  tp(x,y,face){ state.x=x; state.y=y; state.face=face; state.lr = face==="left"?"left":"right"; }, interact, startBattle, map, tileAt, walkable, gainXP, openSheet, NPCS, SHRINES, checkAggro, resolve, castSpell, resonant, get map2(){ return map; }, set mode(v){ mode = v; } };
setup();
})();
</script>

</body>
